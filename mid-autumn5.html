<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoneway Technology - 中秋祝福动态短片</title>
    <!-- 【SEO 防护】声明正版归属权 -->
    <link rel="canonical" href="https://zonewaytechnology.github.io/mid-autumn-video/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030712;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 20px;
            overflow: auto;
            position: relative;
            cursor: default;
        }

        /* 背景星空粒子层 */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: starFall linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes starFall {
            0% { transform: translateY(-10px) translateX(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(100vh) translateX(15px); opacity: 0; }
        }

        /* 顶部安全认证栏与音乐按钮容器 */
        .top-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.5s forwards;
            gap: 15px;
        }

        .official-banner {
            flex-grow: 1;
            background-color: rgba(6, 44, 34, 0.85);
            border: 1px solid #10b981;
            padding: 10px 20px;
            font-size: 0.85rem;
            color: #34d399;
            text-align: center;
            font-family: monospace;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }
        .official-banner a { color: #6ee7b7; text-decoration: underline; font-weight: bold; }

        /* 音乐控制悬浮按钮 */
        .music-btn {
            background: rgba(6, 44, 34, 0.85);
            border: 1px solid #34d399;
            color: #34d399;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .music-btn:hover {
            background: rgba(16, 185, 129, 0.2);
            color: #fff;
        }
        .music-btn.playing {
            border-color: #f59e0b;
            color: #fde047;
            animation: musicPulse 2s infinite ease-in-out;
        }

        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.9); }
        }

        /* 巨幕容器（放大到 680px） */
        .moon-orbit-container {
            position: relative;
            width: 680px;
            height: 680px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            z-index: 10;
            pointer-events: none;
        }

        /* 中心大明月（放大到 320px） */
        .moon {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle at 30% 30%, #4b5563, #1f2937 70%);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: moonAutoActivate 3s ease-in-out 1.5s forwards;
            z-index: 5;
        }

        @keyframes moonAutoActivate {
            0% {
                width: 260px; height: 260px;
                background: radial-gradient(circle at 30% 30%, #4b5563, #1f2937 70%);
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            }
            100% {
                width: 320px; height: 320px;
                background: radial-gradient(circle at 35% 35%, #fffbeb 0%, #fde047 40%, #f59e0b 80%, #b45309 100%);
                box-shadow: 0 0 100px rgba(251, 191, 36, 0.95), inset 0 0 50px rgba(255, 255, 255, 0.8);
            }
        }

        .moon-text {
            font-size: 1.3rem;
            color: #9ca3af;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
            animation: textSwitch 3s ease-in-out 1.5s forwards;
        }

        @keyframes textSwitch {
            0% { color: #9ca3af; }
            100% { color: #78350f; font-size: 1.6rem; text-shadow: 0 2px 4px rgba(255,255,255,0.7); }
        }

        /* 环绕旋转轨道层 */
        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: orbitRotate 26s linear infinite;
        }

        @keyframes orbitRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 巨无霸产品卡片（240px × 240px） */
        .orbit-product {
            position: absolute;
            width: 240px;
            height: 240px;
            background: rgba(6, 78, 59, 0.95);
            border: 3px solid #34d399;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            animation: counterRotate 26s linear infinite;
        }

        .orbit-product img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
        }

        .orbit-product span {
            font-size: 1.1rem;
            color: #a7f3d0;
            margin-top: 8px;
            font-family: monospace;
            font-weight: bold;
            white-space: nowrap;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* 十字精准定位（轨道半径撑开到 240px，完美容纳 240px 大卡片） */
        .p1 { top: 0px; left: 220px; }       /* 正上方：touchscreen1 */
        .p2 { top: 220px; right: 0px; }     /* 正右方：touchscreen2 */
        .p3 { bottom: 0px; left: 220px; }   /* 正下方：touchscreen3 */
        .p4 { top: 220px; left: 0px; }      /* 正左方：touchscreen4 */

        /* 动态电影字幕式祝福语区域 */
        .greeting-box {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            min-height: 100px;
            max-width: 800px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 2s forwards;
        }

        .greeting-box h1 {
            font-size: 1.8rem;
            color: #34d399;
            margin-bottom: 10px;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
        }

        .greeting-box p {
            font-size: 1.1rem;
            color: #9ca3af;
            line-height: 1.6;
            transition: opacity 0.5s ease;
        }

        /* 底部信息淡入 */
        .footer-info {
            font-size: 0.85rem;
            color: #6b7280;
            text-align: center;
            font-family: monospace;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 背景音乐音频对象 -->
    <audio id="bgm" loop preload="auto">
        <source src="https://cdnjs.cloudflare.com/ajax/libs/ion-sound/3.0.7/sounds/bell_ring.ogg" type="audio/ogg">
        <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mpeg">
    </audio>

    <!-- 背景星空粒子生成容器 -->
    <div id="starfield"></div>

    <!-- 顶部栏：官方认证标 + 音乐播放控制按钮 -->
    <div class="top-bar">
        <div class="official-banner">
            🌙 Zoneway Cinematic | <a href="https://www.zoneway.com" target="_blank" rel="noopener noreferrer">www.zoneway.com</a>
        </div>
        <button type="button" class="music-btn" id="musicBtn" onclick="toggleMusic()">
            🔇 开启音乐
        </button>
    </div>

    <!-- 核心全自动点亮明月与巨无霸 4 款触摸屏旋转轨道 -->
    <div class="moon-orbit-container">
        <div class="orbit-ring">
            <div class="orbit-product p1">
                <img src="touchscreen1.jpg" alt="Zoneway Touchscreen 1" loading="eager">
                <span>Model-1</span>
            </div>
            <div class="orbit-product p2">
                <img src="touchscreen2.jpg" alt="Zoneway Touchscreen 2" loading="eager">
                <span>Model-2</span>
            </div>
            <div class="orbit-product p3">
                <img src="touchscreen3.jpg" alt="Zoneway Touchscreen 3" loading="eager">
                <span>Model-3</span>
            </div>
            <div class="orbit-product p4">
                <img src="touchscreen4.jpg" alt="Zoneway Touchscreen 4" loading="eager">
                <span>Model-4</span>
            </div>
        </div>

        <div class="moon" id="moon">
            <div class="moon-text" id="moonText">中秋快乐<br>阖家幸福</div>
        </div>
    </div>

    <!-- 电影级自动轮播的祝福语 -->
    <div class="greeting-box">
        <h1 id="titleText">🌟 中正威科技祝您中秋阖家团圆！</h1>
        <p id="descText">感谢一路相伴，愿明月带去我们最真挚的祝福。新的一季，携手共赢，宏图大展！</p>
    </div>

    <div class="footer-info">
        Shenzhen Zoneway Technology Co., Ltd. | <a href="https://www.zoneway.com" target="_blank" rel="noopener noreferrer" style="color: #9ca3af;">www.zoneway.com</a>
    </div>

    <script>
        // 1. 自动生成星空粒子
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.top = `${Math.random() * -50}px`;
            star.style.animationDuration = `${Math.random() * 4 + 3}s`;
            star.style.animationDelay = `${Math.random() * 4}s`;
            starfield.appendChild(star);
        }

        // 2. 自动轮播祝福文案
        const moonText = document.getElementById('moonText');
        const titleText = document.getElementById('titleText');
        const descText = document.getElementById('descText');

        const cinematicScript = [
            {
                moon: "中秋快乐<br>阖家幸福",
                title: "🌟 中正威科技祝您中秋阖家团圆！",
                desc: "感谢一路相伴，愿明月带去我们最真挚的祝福。新的一季，携手共赢，宏图大展！"
            },
            {
                moon: "生意兴隆<br>万事如意",
                title: "🚀 智造卓越品质，共创辉煌未来！",
                desc: "愿我们的 CTP 触摸屏与显示模组产品，能为您的项目带来如明月般璀璨的商业价值！"
            },
            {
                moon: "技术长虹<br>一路同行",
                title: "🛡️ 匠心守护，值得信赖的工业级伙伴！",
                desc: "我们将继续以极致的技术与服务为您保驾护航。祝您及您的团队中秋安康、大展宏图！"
            }
        ];

        let currentScene = 0;

        setInterval(() => {
            currentScene = (currentScene + 1) % cinematicScript.length;
            const scene = cinematicScript[currentScene];

            descText.style.opacity = '0';
            setTimeout(() => {
                moonText.innerHTML = scene.moon;
                titleText.textContent = scene.title;
                descText.textContent = scene.desc;
                descText.style.opacity = '1';
            }, 500);

        }, 4500);

        // 3. 背景音乐控制逻辑
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgm.pause();
                musicBtn.innerHTML = "🔇 开启音乐";
                musicBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                bgm.play().then(() => {
                    musicBtn.innerHTML = "🎵 音乐播放中";
                    musicBtn.classList.add('playing');
                    isPlaying = true;
                }).catch(e => {
                    console.log("音频播放被浏览器拦截：", e);
                });
            }
        }
    </script>
</body>
</html>
