<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoneway Technology CTP 触摸屏模组</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #08090c;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .page-title h1 { font-size: 1.6rem; color: #10b981; }
        .page-title p { font-size: 0.95rem; color: #9ca3af; margin-top: 6px; }

        /* 外层容器（放大显示） */
        .hardware-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hardware-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* 屏幕点亮区域 */
        .active-screen {
            position: absolute;
            top: 15.5%;
            left: 36.3%;
            width: 27.4%;
            height: 68.8%;
            background-color: #020617;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px 12px;
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.4);
            cursor: pointer;
        }

        /* 顶部状态栏 */
        .screen-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #10b981;
            font-family: monospace;
            font-weight: 600;
            border-bottom: 1px solid rgba(16, 185, 129, 0.3);
            padding-bottom: 6px;
        }

       /* 宝石名片区域 */
        .real-gem-card {
            position: relative;
            width: 100%;
            height: 48%; /* 适当调大宝石占比 */
            background-image: url('gem.png'); /* 直接使用原图，代码会自动过滤黑底 */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            mix-blend-mode: screen; /* 核心：自动把黑色背景过滤为透明 */
            transition: transform 0.15s ease-out;
            transform-style: preserve-3d;
            filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.8));
        }

        /* 宝石流光光效 */
        .real-gem-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                125deg,
                transparent 40%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 60%
            );
            transform: rotate(30deg);
            animation: gemShimmer 5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes gemShimmer {
            0% { transform: translateX(-100%) rotate(30deg); opacity: 0; }
            15% { opacity: 1; }
            25% { transform: translateX(100%) rotate(30deg); opacity: 0; }
            100% { transform: translateX(100%) rotate(30deg); opacity: 0; }
        }

        /* 触控菜单与 RFQ 询价按钮 */
        .touch-menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        .action-btn {
            background: rgba(6, 78, 59, 0.85);
            border: 1px solid rgba(52, 211, 153, 0.6);
            color: #ecfdf5;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        /* 高亮 RFQ 按钮 */
        .action-btn.rfq-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            border-color: #a7f3d0;
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .action-btn:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }

        /* RFQ 弹窗遮罩 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 20;
            text-align: center;
        }

        .modal-content {
            background: #064e3b;
            border: 1px solid #34d399;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .modal-title {
            font-size: 0.8rem;
            color: #a7f3d0;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* 邮箱地址样式 */
        .email-box {
            background: #022c22;
            border: 1px dashed #34d399;
            color: #6ee7b7;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .copy-btn {
            background: #10b981;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .close-btn {
            background: transparent;
            color: #9ca3af;
            border: none;
            font-size: 0.65rem;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 水波纹触控特效 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(110, 231, 183, 0.7);
            transform: scale(0);
            animation: ripple-anim 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to { transform: scale(3.5); opacity: 0; }
        }

        /* 底部型号文本 */
        .screen-footer {
            font-size: 0.85rem;
            font-weight: 800;
            color: #34d399;
            letter-spacing: 0.5px;
            font-family: monospace;
            text-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
        }
    </style>
</head>
<body>

    <!-- 已更新顶部文字 -->
    <div class="page-title">
        <h1>Zoneway Technology CTP 触摸屏模组</h1>
        <p>支持在线查看规格书及一键获取 RFQ 询价邮箱</p>
    </div>

    <!-- 硬件实物外壳 -->
    <div class="hardware-wrapper">
        <img src="screen-frame.jpg" alt="5.5 Touchscreen Frame" class="hardware-img">

        <!-- 实物黑屏内部的交互点亮区域 -->
        <div class="active-screen" id="activeScreen">
            
            <!-- 状态栏 -->
            <div class="screen-header">
                <span>ZONEWAY TECHNOLOGY CTP</span>
                <span>720×1440</span>
            </div>

            <!-- 宝石名片 -->
            <div class="real-gem-card" id="gemCard"></div>

            <!-- 触控菜单包含 RFQ 按键 -->
            <div class="touch-menu">
                <button class="action-btn rfq-btn" onclick="openRfqModal(event)">
                    <span>📩 发送 RFQ 询价</span>
                    <span>➔</span>
                </button>
                <button class="action-btn" onclick="window.open('ZZW550HIS-2286A.pdf', '_blank')">
                    <span>📄 查看 Datasheet</span>
                    <span>➔</span>
                </button>
                <button class="action-btn" onclick="alert('联系电话：+86 18124585116 (Susan Xiao)')">
                    <span>📞 呼叫 Susan Xiao</span>
                    <span>➔</span>
                </button>
            </div>

            <!-- 底部醒目标号 -->
            <div class="screen-footer">MODEL: ZZW550HIS-2286A</div>

            <!-- RFQ 邮箱展示弹窗 -->
            <div class="modal-overlay" id="rfqModal">
                <div class="modal-content">
                    <div class="modal-title">RFQ 官方询价邮箱</div>
                    <div class="email-box" id="emailText">sales@zoneway.com</div>
                    <button class="copy-btn" onclick="copyEmail()">📋 一键复制邮箱</button>
                    <div><button class="close-btn" onclick="closeRfqModal(event)">关闭窗口</button></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const screen = document.getElementById('activeScreen');
        const gemCard = document.getElementById('gemCard');
        const rfqModal = document.getElementById('rfqModal');

        // 打开 RFQ 弹窗
        function openRfqModal(e) {
            e.stopPropagation();
            rfqModal.style.display = 'flex';
        }

        // 关闭 RFQ 弹窗
        function closeRfqModal(e) {
            e.stopPropagation();
            rfqModal.style.display = 'none';
        }

        // 一键复制邮箱
        function copyEmail() {
            const email = document.getElementById('emailText').innerText;
            navigator.clipboard.writeText(email).then(() => {
                alert('邮箱地址已成功复制到剪贴板！\n' + email);
            }).catch(() => {
                alert('复制失败，请手动复制：' + email);
            });
        }

        // 水波纹触控反馈
        screen.addEventListener('click', function(e) {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const circle = document.createElement('div');
            circle.classList.add('ripple');
            circle.style.left = `${x - 15}px`;
            circle.style.top = `${y - 15}px`;
            circle.style.width = '30px';
            circle.style.height = '30px';

            screen.appendChild(circle);
            setTimeout(() => { circle.remove(); }, 500);
        });

        // 3D 倾斜光彩跟随
        screen.addEventListener('mousemove', function(e) {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            const tiltX = -y / 6;
            const tiltY = x / 6;

            gemCard.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.05)`;
        });

        screen.addEventListener('mouseleave', function() {
            gemCard.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
        });
    </script>
</body>
</html>
