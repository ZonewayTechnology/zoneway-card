<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoneway 5.5" CTP Touch Module & Real Emerald Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0b0c10;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 主设备卡片容器（直接以实物照片作为基础外壳） */
        .hardware-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* 匹配实物图片的比例大小 */
            aspect-ratio: 4 / 3;
            background-image: url('screen-frame.jpg'); /* 使用你的实物照片 */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 嵌入在实物黑屏区域内部的“点亮屏幕” */
        .active-screen {
            position: absolute;
            /* 精确对齐实物照片中的黑色显示区域 */
            top: 15.5%;
            left: 36.3%;
            width: 27.5%;
            height: 68.8%;
            background-color: #030712; /* 点亮屏幕的暗背景 */
            overflow: hidden;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 6px;
            box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.3); /* 模拟屏幕背光微光 */
            cursor: pointer;
        }

        /* 顶部状态栏 */
        .screen-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.5rem;
            color: #10b981;
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding-bottom: 4px;
            font-family: monospace;
        }

        /* 核心：翡翠宝石名片 */
        .real-gem-card {
            position: relative;
            width: 100%;
            height: 48%;
            background-image: url('gem.png'); /* 使用你的宝石原图 */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.15s ease-out;
            transform-style: preserve-3d;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5));
        }

        /* 宝石表面扫过柔光 */
        .real-gem-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                125deg,
                transparent 40%,
                rgba(255, 255, 255, 0.25) 50%,
                transparent 60%
            );
            transform: rotate(30deg);
            animation: gemShimmer 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes gemShimmer {
            0% { transform: translateX(-100%) rotate(30deg); opacity: 0; }
            10% { opacity: 1; }
            20% { transform: translateX(100%) rotate(30deg); opacity: 0; }
            100% { transform: translateX(100%) rotate(30deg); opacity: 0; }
        }

        /* 触控交互菜单 */
        .touch-menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 5;
        }

        .action-btn {
            background: rgba(6, 78, 59, 0.7);
            border: 1px solid rgba(52, 211, 153, 0.5);
            color: #d1fae5;
            padding: 6px 4px;
            border-radius: 4px;
            font-size: 0.55rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .action-btn:hover {
            background: rgba(16, 185, 129, 0.5);
            color: #ffffff;
            border-color: #6ee7b7;
        }

        /* 水波纹效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(110, 231, 183, 0.6);
            transform: scale(0);
            animation: ripple-anim 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to { transform: scale(3); opacity: 0; }
        }

        /* 底部标注 */
        .screen-footer {
            font-size: 0.45rem;
            color: #6b7280;
            text-align: center;
            font-family: monospace;
        }

        .page-title {
            margin-bottom: 20px;
            text-align: center;
        }
        .page-title h1 { font-size: 1.2rem; color: #10b981; font-weight: 600; }
        .page-title p { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="page-title">
        <h1>Zoneway 5.5" CTP 硬件模组 $\times$ 翡翠名片</h1>
        <p>基于硬件实物图的真彩显示与 3D 触控交互演示</p>
    </div>

    <!-- 硬件实物外壳（直接引用实物图片） -->
    <div class="hardware-container">
        <!-- 点亮的屏幕区域 -->
        <div class="active-screen" id="activeScreen">
            
            <!-- 状态栏 -->
            <div class="screen-header">
                <span>ZONEWAY</span>
                <span>MIPI 720×1440</span>
            </div>

            <!-- 宝石名片 -->
            <div class="real-gem-card" id="gemCard"></div>

            <!-- 触控菜单按钮 -->
            <div class="touch-menu">
                <button class="action-btn" onclick="window.open('ZZW550HIS-2286A.pdf', '_blank')">
                    <span>📄 模组 Datasheet</span>
                    <span>➔</span>
                </button>
                <button class="action-btn" onclick="alert('联系电话：+86 18124585116 (Susan Xiao)')">
                    <span>📞 呼叫 Susan Xiao</span>
                    <span>➔</span>
                </button>
            </div>

            <!-- 页脚 -->
            <div class="screen-footer">MODEL: ZZW550HIS-2286A</div>
        </div>
    </div>

    <script>
        const screen = document.getElementById('activeScreen');
        const gemCard = document.getElementById('gemCard');

        // 点击屏幕水波纹触控特效
        screen.addEventListener('click', function(e) {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const circle = document.createElement('div');
            circle.classList.add('ripple');
            circle.style.left = `${x - 15}px`;
            circle.style.top = `${y - 15}px`;
            circle.style.width = '30px';
            circle.style.height = '30px';

            screen.appendChild(circle);
            setTimeout(() => { circle.remove(); }, 500);
        });

        // 3D 动态倾斜与光影交互
        screen.addEventListener('mousemove', function(e) {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            const tiltX = -y / 8;
            const tiltY = x / 8;

            gemCard.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.03)`;
        });

        screen.addEventListener('mouseleave', function() {
            gemCard.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
        });
    </script>
</body>
</html>
